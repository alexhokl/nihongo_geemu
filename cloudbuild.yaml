logsBucket: "gs://craffy-build-logs"

options:
  machineType: E2_HIGHCPU_8 # 8 vCPU
  logging: GCS_ONLY

timeout: "1200s" # 20 minutes

substitutions:
  _FLUTTER_IMAGE: "asia-east1-docker.pkg.dev/craffy/private/flutter:3.47.7"

availableSecrets:
  secretManager:
    - versionName: projects/craffy/secrets/nihongo-geemu-keystore/versions/latest
      env: KEYSTORE_B64
    - versionName: projects/craffy/secrets/nihongo-geemu-key-properties/versions/latest
      env: KEY_PROPERTIES

steps:
  - name: "${_FLUTTER_IMAGE}"
    id: Build APK
    waitFor: ["-"]
    # Writes local.properties and the signing files, runs pub get
    # and builds the release APK; see build-apk in the flutter-build image.
    entrypoint: build-apk
    args: ["."]
    secretEnv: ["KEYSTORE_B64", "KEY_PROPERTIES"]
    env:
      - "GIT_COMMIT=$SHORT_SHA"

  - name: "gcr.io/cloud-builders/gcloud"
    id: Upload APK
    waitFor: [Build APK]
    entrypoint: gcloud
    args:
      - storage
      - cp
      - build/app/outputs/flutter-apk/app-release.apk
      - gs://alexhokl_public/apk/nihongo_geemu-$TAG_NAME-$SHORT_SHA.apk
