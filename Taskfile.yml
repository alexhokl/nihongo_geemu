version: "3"

includes:
  flutter:
    taskfile: ../flutter-helper/taskfiles/flutter.yml
    flatten: true
    vars:
      APP: nihongo-geemu
      MOBILE_DIR: "."
      MAC_APP: "Nihongo Geemu.app"

tasks:
  test:
    desc: Test
    cmd: flutter test --no-pub --coverage

  coverage:
    desc: Generate HTML of coverage and open in browser
    preconditions:
      - test -f coverage/lcov.info
      - sh: '[ ! -z "$(which genhtml)" ]'
    cmds:
      - genhtml coverage/lcov.info -o coverage/html
      - open coverage/html/index.html

  lint:
    desc: Lint
    cmd: dart fix --dry-run

  lint-fix:
    desc: Lint Fix
    cmd: dart fix --apply
